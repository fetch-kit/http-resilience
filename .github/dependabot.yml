version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # The resilience libraries/adapters exercised by this repo's test matrix.
      # Kept in one group so they can be bumped and reviewed together, but
      # majors are excluded so breaking changes arrive as individual PRs.
      resilience-libraries:
        patterns:
          - "@fetchkit/ffetch"
          - "@resili/*"
          - "ky"
          - "fetch-retry"
          - "ofetch"
          - "wretch"
          - "resilient-fetch-client"
          - "fetch-smartly"
          - "fetch-resilience"
          - "flowshield"
          - "ts-retry-circuit"
          - "cockatiel"
        update-types:
          - "minor"
          - "patch"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"

# No `github-actions` ecosystem entry yet: this repo has no workflow files, and
# Dependabot fails the update job with `dependency_file_not_found`
# ("/action.yml or /.github/workflows/<anything>.yml not found") when the
# ecosystem is enabled without one. Add it back, using the same shape as the
# npm entry above, once `.github/workflows/` exists.
