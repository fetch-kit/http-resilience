name: Publish correctness matrix

# Failing correctness assertions are this repo's data, not a defect: the report
# command exits nonzero by design. This workflow therefore *publishes* the
# result instead of gating on it. The real gate is scripts/verify-report.ts,
# which refuses to deploy a matrix with missing cells, so a crashed run leaves
# the previously published matrix untouched.
#
# Pages must be enabled once (Settings -> Pages -> Source: GitHub Actions).
# actions/configure-pages can only do that with a token other than GITHUB_TOKEN.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, after the weekly Dependabot bumps land
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/report-pages.yml
      - package-lock.json
      - package.json
      - scripts/**
      - src/**
      - test/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24' # engines: ^24.0.0 || >=26.0.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Generate the matrix
        run: 'npm run report || echo "report exited nonzero, as designed: failing assertions are the matrix data"'
      - name: Refuse to publish an incomplete matrix
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-report.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the report root
        run: cp results/matrix.html results/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: results

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
